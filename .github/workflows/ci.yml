name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 测试跑的是打包产物，npm test 自己会先 build
      - run: npm test
      # 打包也在 CI 里跑一遍：漏进白名单的文件、写坏的 zip 都能当场发现
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: build/*.zip

  # 端到端要下一个完整的 Chromium（扩展装不进 headless shell），单独一个 job，
  # 挂了不影响单元测试那条线的结论。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
