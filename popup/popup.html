<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <img class="mark" src="../icons/icon32.png" alt="">
      <span class="name">Sub Translator</span>
    </div>
    <label class="switch" title="总开关" data-i18n-title="popupMaster">
      <input type="checkbox" id="master">
      <span class="track"><span class="knob"></span></span>
    </label>
  </header>

  <!-- 还没配接口时的第一件事：这插件不填东西根本用不了，别让人等到第一批翻译失败才知道 -->
  <section class="setup hidden" id="setupBar">
    <span class="setupText" data-i18n="popupSetup">还没配置接口，先填 API 地址和 Key</span>
    <button class="setupBtn" id="setupBtn" type="button" data-i18n="popupToOptions">去设置</button>
  </section>

  <section class="status" id="statusCard">
    <div class="row">
      <span class="dot" id="dot"></span>
      <span class="statusText" id="statusText" data-i18n="popupNoVideo">未检测到视频</span>
    </div>
    <div class="title" id="videoTitle"></div>
    <div class="src hidden" id="srcText"></div>
    <div class="bar"><span id="barFill"></span></div>
    <button class="ghost hidden" id="retryBtn" data-i18n="popupRetry">重试失败的批次</button>
    <!-- 按错误码给出的那一个下一步动作：去设置 / 去授权 -->
    <button class="ghost hidden" id="fixBtn"></button>
    <button class="ghost hidden" id="purgeBtn" title="丢掉这个视频已缓存的译文，从头重翻"
            data-i18n="popupPurge" data-i18n-title="popupPurgeTip">译文和原文对不上？重翻本视频</button>
    <div class="err hidden" id="errText"></div>
  </section>

  <section class="block">
    <div class="labelRow">
      <span class="label" data-i18n="popupReasoning">推理强度</span>
      <!-- 模型名同时是配置档的切换入口：点一下就能换一套接口，不用跑设置页 -->
      <div class="pfWrap">
        <button class="modelTag" id="modelTag" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="pfMenu hidden" id="pfMenu" role="menu"></div>
      </div>
    </div>
    <div class="seg" id="reasoning">
      <button data-v="none" data-i18n="popupOff">关闭</button>
      <button data-v="low" data-i18n="popupLow">低</button>
      <button data-v="medium" data-i18n="popupMedium">中</button>
    </div>
    <div class="hint" id="reasonHint">字幕翻译一般「关闭」就够，最快最省。</div>
  </section>

  <section class="block">
    <div class="labelRow">
      <span class="label" data-i18n="popupFontSize">字号</span>
      <span class="val" id="fontVal">22</span>
    </div>
    <input type="range" id="fontSize" min="14" max="64" step="1">
    <div class="hint" data-i18n="popupFontHint">全屏时会按画面高度自动放大，这里是小窗口下的基准值。</div>
  </section>

  <section class="block tight">
    <label class="check">
      <input type="checkbox" id="autoStart">
      <span data-i18n="popupAutoStart">外语视频自动开启</span>
    </label>
  </section>

  <div class="toast hidden" id="toast"></div>

  <footer class="foot">
    <span class="usage" id="usage">—</span>
    <span class="footRight">
      <button class="link" id="copyDiag" data-i18n="popupCopyDiag" data-i18n-title="popupCopyDiagTip"
              title="把最近的状态、错误和请求摘要复制下来，报障时贴出来（不含 API Key）">复制诊断</button>
      <button class="link" id="openOptions" data-i18n="popupOptions">设置</button>
    </span>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
